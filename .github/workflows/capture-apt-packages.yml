name: Capture Apt Packages

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Capture from ARM device
        continue-on-error: true
        run: |
          http_code=$(curl -s -w "%{http_code}" \
            --max-time 120 \
            -u "${{ secrets.WEBHOOK_USER }}:${{ secrets.WEBHOOK_PASSWORD }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "X-Hook-Mode: chunked" \
            -o arm-n2-odroid/apt-packages.txt \
            "https://derog-hc-deploy.jaggi.xyz/capture-packages.sh?run_id=${{ github.run_id }}")

          echo "ARM capture: HTTP $http_code ($(wc -l < arm-n2-odroid/apt-packages.txt) lines)"

      - name: Capture from x64 device
        continue-on-error: true
        run: |
          http_code=$(curl -s -w "%{http_code}" \
            --max-time 120 \
            -u "${{ secrets.WEBHOOK_USER }}:${{ secrets.WEBHOOK_PASSWORD }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "X-Hook-Mode: chunked" \
            -o x64-rack-server/apt-packages.txt \
            "https://derog-rack-deploy.jaggi.xyz/capture-packages.sh?run_id=${{ github.run_id }}")

          echo "x64 capture: HTTP $http_code ($(wc -l < x64-rack-server/apt-packages.txt) lines)"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git add arm-n2-odroid/apt-packages.txt x64-rack-server/apt-packages.txt
          git commit -m "chore: update apt-packages.txt from devices [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
