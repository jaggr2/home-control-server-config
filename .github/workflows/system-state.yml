name: Get System State

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  capture:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device:
          - name: arm-n2-odroid
            url: https://derog-hc-deploy.jaggi.xyz
          - name: x64-rack-server
            url: https://derog-rack-deploy.jaggi.xyz
    steps:
      - name: Get ${{ matrix.device.name }} system state
        continue-on-error: true
        run: |
          echo "=== ${{ matrix.device.name }} System State ==="
          echo "Date: $(date)"
          echo ""

          curl -X POST \
            -u "${{ secrets.WEBHOOK_USER }}:${{ secrets.WEBHOOK_PASSWORD }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            --no-progress-meter \
            --retry 3 \
            --retry-delay 5 \
            "${{ matrix.device.url }}/ps.sh?run_id=${{ github.run_id }}" \
            | tee "/tmp/${{ matrix.device.name }}-state.txt"

          echo ""
          echo "=== State captured to /tmp/${{ matrix.device.name }}-state.txt ==="
