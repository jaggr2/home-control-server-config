name: Update and Deploy Containers

on:
  push:
    branches: [main]
    paths:
      - 'arm-n2-odroid/**'
      - 'x64-rack-server/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device'
        required: true
        type: choice
        options:
          - arm-n2-odroid
          - x64-rack-server
          - both
  schedule:
    - cron: '0 3 * * 0'

jobs:
  renovate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config_path:
          - arm-n2-odroid/renovate.json
          - x64-rack-server/renovate.json
    steps:
      - uses: actions/checkout@v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.10
        with:
          configurationFile: ${{ matrix.config_path }}
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info

  deploy:
    needs: renovate
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device:
          - name: arm-n2-odroid
            url: https://derog-hc-deploy.jaggi.xyz
          - name: x64-rack-server
            url: https://derog-rack-deploy.jaggi.xyz
    steps:
      - name: Deploy to ${{ matrix.device.name }}
        continue-on-error: true
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            --max-time 10 \
            -u "${{ secrets.WEBHOOK_USER }}:${{ secrets.WEBHOOK_PASSWORD }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "X-Hook-Mode: buffered" \
            "${{ matrix.device.url }}/health.sh?run_id=${{ github.run_id }}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          if [ "$http_code" -eq 200 ] && [ "$body" = "OK" ]; then
            echo "Health check OK for ${{ matrix.device.name }}"
          else
            echo "Health check failed for ${{ matrix.device.name }}: HTTP $http_code"
          fi

      - name: Trigger apply-config on ${{ matrix.device.name }}
        continue-on-error: true
        run: |
          last_line=$(curl -X POST \
            -u "${{ secrets.WEBHOOK_USER }}:${{ secrets.WEBHOOK_PASSWORD }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            --no-progress-meter \
            --retry 3 \
            --retry-delay 5 \
            "${{ matrix.device.url }}/apply-config.sh?run_id=${{ github.run_id }}&repo=${{ github.repository }}&sha=${{ github.sha }}" \
            | tee /tmp/webhook_response.json)

          # Check for error in response
          if echo "$last_line" | grep -q "error:"; then
            echo "Deploy failed for ${{ matrix.device.name }}"
            echo "$last_line"
          else
            echo "Deploy OK for ${{ matrix.device.name }}"
          fi
