#cloud-config
# Home Assistant OS VM — metadata for virt-install
#
# HA OS ships as a pre-built QCOW2 appliance — cloud-init is not supported.
# This file serves as documentation for the virt-install command used in
# setup/07-vm-create.sh.
#
# Image source: https://github.com/home-assistant/operating-system/releases
# Download:     haos_ova-*.qcow2.xz (latest stable)
# Docs:         https://www.home-assistant.io/installation/linux

# Virt-install reference (executed by setup/07-vm-create.sh):
#
#   virt-install \
#     --name ha-os \
#     --memory 4096 \
#     --vcpus 2 \
#     --disk path=/var/lib/libvirt/images/ha-os/haos.qcow2,format=qcow2,bus=virtio \
#     --network network=trusted,model=virtio \
#     --graphics none \
#     --console pty,target_type=serial \
#     --os-variant linux2022 \
#     --import \
#     --boot uefi \
#     --noautoconsole
#
# CRITICAL: HA OS REQUIRES UEFI (OVMF) to boot. Without --boot uefi the VM
# boots in legacy BIOS mode, never initializes the network, and gets no DHCP.
# Use non-secure OVMF (do NOT enable Secure Boot — HA OS is not MS-signed).
#
# Post-boot:
#   - Access: http://<vm-ip>:8123
#   - First boot wizard sets up user, location, integrations
#   - Add Node-RED addon: Settings → Add-ons → Node-RED
#   - Install HACS if needed

# Hardware notes:
#   - Memory: 4 GB (official minimum)
#   - Disk: 32 GB minimum (includes OS + addons + backups)
#   - Network: VLAN 1 (Trusted) with access to VLAN 20 (IoT)
#              Add second NIC for IoT: --network bridge=br0.20,model=virtio
#   - USB passthrough: Add for Zigbee/Z-Wave dongles, e.g.:
#     --hostdev 001.003  (from lsusb)
